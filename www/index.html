<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>生字消消乐</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="fx-layer"></div>

  <!-- 首页 -->
  <div id="screen-home" class="screen active">
    <div class="cloud c1">☁️</div>
    <div class="cloud c2">☁️</div>
    <div class="cloud c3">☁️</div>
    <div class="home-wrap">
      <div class="sanrio-row">
        <img class="sanrio-avatar bounce1" src="img/kuromi.png" alt="库洛米">
        <img class="sanrio-avatar bounce2" src="img/melody.png" alt="美乐蒂">
        <img class="sanrio-avatar bounce3" src="img/cinnamoroll.png" alt="大耳狗">
      </div>
      <h1 class="game-title">生字消消乐</h1>
      <p class="game-sub">三年级上册 · 人教版 · <span id="total-chars">228</span> 个生字</p>
      <div class="mode-grid">
        <button class="mode-card" data-mode="match">
          <span class="mode-emoji">🀄</span>
          <span class="mode-name">配对消消乐</span>
          <span class="mode-desc">汉字 ↔ 拼音连连看</span>
        </button>
        <button class="mode-card" data-mode="pinyin">
          <span class="mode-emoji">🔤</span>
          <span class="mode-name">看拼音选字</span>
          <span class="mode-desc">拼音对了字才对</span>
        </button>
        <button class="mode-card" data-mode="dictation">
          <span class="mode-emoji">🎧</span>
          <span class="mode-name">听写闯关</span>
          <span class="mode-desc">听词语写汉字</span>
        </button>
        <button class="mode-card" data-mode="monster">
          <img class="mode-img" src="img/kuromi.png" alt="库洛米">
          <span class="mode-name">打怪兽</span>
          <span class="mode-desc">拼音答对打怪兽</span>
        </button>
        <button class="mode-card" data-mode="balloon">
          <img class="mode-img" src="img/cinnamoroll.png" alt="大耳狗">
          <span class="mode-name">打气球</span>
          <span class="mode-desc">打气球认生字</span>
        </button>
        <button class="mode-card" data-mode="write">
          <img class="mode-img" src="img/melody.png" alt="美乐蒂">
          <span class="mode-name">书写乐园</span>
          <span class="mode-desc">手指写字词</span>
        </button>
        <button class="mode-card" data-mode="mistakes">
          <span class="mode-emoji">📝</span>
          <span class="mode-name">错字本</span>
          <span class="mode-desc"><span id="mistake-count">0</span> 个待复习</span>
        </button>
      </div>
      <p class="home-tip">💡 每天玩 10 分钟，生字记得牢</p>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div id="screen-levels" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="levels-back">‹</button>
      <h2 id="levels-title">选关卡</h2>
      <div class="topbar-spacer"></div>
    </div>
    <div id="level-grid" class="level-grid"></div>
  </div>

  <!-- 配对消消乐 -->
  <div id="screen-match" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="match-back">‹</button>
      <div class="hud">
        <span class="hud-item">⭐ <b id="match-score">0</b></span>
        <span class="hud-item">⏱ <b id="match-time">0:00</b></span>
        <span class="hud-item">💡 <b id="match-hints">3</b></span>
      </div>
      <button class="icon-btn" id="match-hint-btn">💡</button>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="match-progress"></div></div>
    <div id="match-board" class="match-board"></div>
    <div id="combo-banner" class="combo-banner hidden"></div>
  </div>

  <!-- 看拼音选字 -->
  <div id="screen-pinyin" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="pinyin-back">‹</button>
      <div class="hud">
        <span class="hud-item">⭐ <b id="pinyin-score">0</b></span>
        <span class="hud-item"><b id="pinyin-q">1</b>/10</span>
      </div>
      <div class="topbar-spacer"></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="pinyin-progress"></div></div>
    <div class="quiz-wrap">
      <div class="quiz-pinyin" id="pinyin-question">píng</div>
      <div class="quiz-hint" id="pinyin-word-hint"></div>
      <div class="quiz-options" id="pinyin-options"></div>
    </div>
  </div>

  <!-- 听写闯关 -->
  <div id="screen-dictation" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="dict-back">‹</button>
      <div class="hud">
        <span class="hud-item">⭐ <b id="dict-score">0</b></span>
        <span class="hud-item"><b id="dict-q">1</b>/10</span>
      </div>
      <button class="icon-btn" id="dict-replay">🔊</button>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="dict-progress"></div></div>
    <div class="quiz-wrap">
      <button class="big-speaker" id="dict-speaker">🔊<span>点我听词语</span></button>
      <div class="dict-slots" id="dict-slots"></div>
      <div class="quiz-options dict-options" id="dict-options"></div>
      <div class="dict-actions">
        <button class="btn-secondary" id="dict-clear">重选</button>
        <button class="btn-primary" id="dict-submit">确定</button>
      </div>
    </div>
  </div>

  <!-- 打怪兽 -->
  <div id="screen-monster" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="monster-back">‹</button>
      <div class="hud">
        <span class="hud-item">❤️ <b id="monster-hp">3</b></span>
        <span class="hud-item">👹 <b id="monster-count">1/10</b></span>
        <span class="hud-item">⭐ <b id="monster-score">0</b></span>
      </div>
      <div class="topbar-spacer"></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="monster-progress"></div></div>
    <div class="monster-arena" id="monster-arena">
      <div class="arena-stars" id="arena-stars"></div>
      <div class="arena-moon">🌙</div>
      <div class="monster-shadow" id="monster-shadow"></div>
      <div class="monster" id="monster-body">
        <img class="monster-emoji" id="monster-emoji" src="img/kuromi.png" alt="库洛米">
        <div class="monster-anger" id="monster-anger">💢</div>
        <div class="monster-char" id="monster-char">字</div>
      </div>
      <div class="player-side" id="player-side"><img id="player-emoji" src="img/melody.png" alt="美乐蒂"></div>
      <div class="arena-fog"></div>
    </div>
    <div class="monster-quiz">
      <div class="quiz-hint">怪兽身上的字，拼音是？</div>
      <div class="quiz-options" id="monster-options"></div>
    </div>
  </div>

  <!-- 打气球 -->
  <div id="screen-balloon" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="balloon-back">‹</button>
      <div class="hud">
        <span class="hud-item">🛡️ <b id="balloon-shield">3</b></span>
        <span class="hud-item">🎯 <b id="balloon-kills">0/6</b></span>
        <span class="hud-item">⭐ <b id="balloon-score">0</b></span>
      </div>
      <div class="topbar-spacer"></div>
    </div>
    <div class="balloon-target">🎯 打破 <b id="balloon-target-py">píng</b> 的汉字气球！</div>
    <div class="balloon-stage">
      <canvas id="balloon-canvas"></canvas>
      <button class="fire-btn" id="balloon-fire">🎈<span>发射</span></button>
    </div>
    <div class="balloon-tip">👆 拖动大耳狗移动 · 点发射或直接点气球射击</div>
  </div>

  <!-- 书写乐园 -->
  <div id="screen-write" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="write-back">‹</button>
      <div class="hud">
        <span class="hud-item">✍️ <b id="write-q">1/10</b></span>
      </div>
      <div class="topbar-spacer"></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="write-progress"></div></div>
    <div class="write-card">
      <div class="write-char" id="write-char">字</div>
      <div class="write-meta">
        <div class="write-py" id="write-py">zì</div>
        <div class="write-words" id="write-words">写字</div>
      </div>
      <button class="icon-btn" id="write-speak">🔊</button>
    </div>
    <div class="write-toolbar">
      <button class="btn-secondary small" id="write-toggle-guide">描红：开</button>
      <button class="btn-secondary small" id="write-toggle-mode">练字</button>
      <div class="write-colors" id="write-colors">
        <button class="color-dot sel" data-c="#4dabf7" style="background:#4dabf7"></button>
        <button class="color-dot" data-c="#ff6b6b" style="background:#ff6b6b"></button>
        <button class="color-dot" data-c="#69db7c" style="background:#69db7c"></button>
        <button class="color-dot" data-c="#ffa94d" style="background:#ffa94d"></button>
        <button class="color-dot" data-c="#b197fc" style="background:#b197fc"></button>
      </div>
    </div>
    <canvas id="write-canvas"></canvas>
    <div class="write-actions">
      <button class="btn-secondary" id="write-clear">🧹 清除重写</button>
      <button class="btn-primary" id="write-next">写好了 →</button>
    </div>
  </div>

  <!-- 错字本 -->
  <div id="screen-mistakes" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="mistakes-back">‹</button>
      <h2>错字本</h2>
      <button class="btn-secondary small" id="mistakes-clear">清空</button>
    </div>
    <div id="mistake-list" class="mistake-list"></div>
  </div>

  <!-- 过关弹窗 -->
  <div id="modal-win" class="modal hidden">
    <div class="modal-card">
      <img class="win-mascot" src="img/melody.png" alt="美乐蒂">
      <h2>过关啦！</h2>
      <div class="stars" id="win-stars">⭐⭐⭐</div>
      <p id="win-stats"></p>
      <div class="modal-btns">
        <button class="btn-secondary" id="win-replay">再玩一次</button>
        <button class="btn-primary" id="win-next">下一关</button>
      </div>
    </div>
  </div>
</div>
<script src="data/chars-3a.js"></script>
<script src="app.js"></script>
</body>
</html>
